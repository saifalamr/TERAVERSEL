<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>QR Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Luckiest+Guy&family=Inter:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
<style>
  :root{
    --ink:#0a0a0a;
    --paper:#ffffff;
    --paper-soft:#f7f6f4;
    --hairline:#dedcd8;
    --hairline-strong:#0a0a0a;
    --muted:#7a7a78;
    --muted-2:#b5b3af;
    --ease: cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);}
  body{
    font-family:'Inter', -apple-system, sans-serif;
    overflow-x:hidden;
    min-height:100vh;
  }
  body.lang-ar{font-family:'Noto Kufi Arabic','Inter',sans-serif;}
  .display{font-family:'Luckiest Guy', 'Fraunces', cursive; font-optical-sizing:auto; letter-spacing:.01em;}
  .lang-ar .display{font-family:'Noto Kufi Arabic','Fraunces',serif; letter-spacing:0;}

  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--paper);
    position:relative;
    display:flex;
    flex-direction:column;
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important; animation:none !important;}
  }

  /* ---------- Welcome ---------- */
  .welcome-screen{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:40px 32px;
    text-align:center;
    animation:fadeIn .6s var(--ease);
    background:var(--ink);
    color:var(--paper);
    position:relative;
  }
  .welcome-screen::before{
    content:"";
    position:absolute;
    top:14px; left:14px; right:14px; bottom:14px;
    border:3px solid #ffffff;
    border-radius:18px;
    pointer-events:none;
    z-index:2;
  }
  .icon-rain{
    position:absolute; inset:0;
    overflow:hidden;
    z-index:0;
    pointer-events:none;
  }
  .rain-icon{
    position:absolute;
    top:-12%;
    color:rgba(255,255,255,.9);
    animation-name:fallDown;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
  }
  .rain-icon svg{width:100%; height:100%; display:block;}
  .rain-icon img{height:100%; width:auto; display:block; filter:drop-shadow(0 2px 6px rgba(0,0,0,.4));}
  @keyframes fallDown{
    0%{ transform:translateY(0) rotate(0deg); }
    100%{ transform:translateY(118vh) rotate(28deg); }
  }
  .welcome-screen > *:not(.icon-rain){ position:relative; z-index:1; }
  @keyframes fadeIn{from{opacity:0} to{opacity:1}}
  .welcome-logo{
    width:248px;height:248px;border-radius:50%;
    border:1.5px solid rgba(255,255,255,.5);
    display:flex;align-items:center;justify-content:center;
    margin-bottom:34px;
    overflow:hidden;
    background:var(--ink);
  }
  .welcome-logo img{width:100%;height:100%;object-fit:cover;}
  .welcome-logo span{font-family:'Fraunces',serif;font-size:28px;letter-spacing:1px; color:var(--paper);}
  .welcome-eyebrow{
    font-size:11px; letter-spacing:.22em; text-transform:uppercase;
    color:rgba(255,255,255,.55); margin-bottom:10px;
  }
  .entry-sign{
    display:flex; align-items:center; gap:7px;
    font-family:'Inter', sans-serif; font-size:14px; font-weight:700; letter-spacing:.03em;
    color:#ffffff; background:#1c8a3e;
    border:1px solid #2fae55;
    border-radius:10px;
    padding:9px 13px;
    margin:0 0 44px;
    cursor:pointer;
    box-shadow:0 6px 16px rgba(28,138,62,.32);
    transition:transform .18s var(--ease), box-shadow .18s var(--ease), background .18s var(--ease);
  }
  .entry-sign svg{width:16px; height:16px; flex-shrink:0;}
  .entry-sign:active{
    transform:scale(.97);
    background:#187534;
    box-shadow:0 4px 12px rgba(28,138,62,.3);
  }
  .lang-label{
    font-size:11px; letter-spacing:.18em; text-transform:uppercase;
    color:rgba(255,255,255,.55); margin-bottom:16px;
  }
  .lang-row{display:flex; gap:8px;}
  .lang-pill{
    display:flex; align-items:center; gap:6px;
    padding:9px 15px;
    border:1px solid rgba(255,255,255,.5);
    border-radius:999px;
    background:transparent;
    color:var(--paper);
    font-size:12.5px; font-weight:500;
    cursor:pointer;
    transition:background .25s var(--ease), color .25s var(--ease);
  }
  .lang-pill:active{background:var(--paper); color:var(--ink);}
  .lang-flag{font-size:14px; line-height:1;}

  /* ---------- Shared header ---------- */
  .topbar{
    position:sticky; top:0; z-index:20;
    background:var(--ink);
    border-bottom:1px solid rgba(255,255,255,.14);
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px;
  }
  .topbar-left{display:flex; align-items:center; gap:10px; min-width:32px;}
  .icon-btn{
    width:32px;height:32px; display:flex; align-items:center; justify-content:center;
    border:none; background:none; cursor:pointer; color:var(--ink);
    border-radius:50%;
  }
  .icon-btn:active{background:var(--paper-soft);}
  .topbar .icon-btn{color:var(--paper);}
  .topbar .icon-btn:active{background:rgba(255,255,255,.12);}
  .back-btn{
    display:flex; align-items:center; gap:5px; width:auto !important; height:auto !important;
    padding:6px 12px 6px 8px; border-radius:20px; font-size:12.5px; font-weight:600;
  }
  .back-btn svg{width:16px;height:16px;}
  .topbar-title{
    font-size:15px; letter-spacing:.02em; font-weight:500;
    position:absolute; left:50%; transform:translateX(-50%);
    color:var(--paper);
    display:flex; align-items:center; gap:8px;
    max-width:60%;
  }
  .topbar-title span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .topbar-logo{
    width:50px; height:50px; border-radius:50%; object-fit:cover; flex-shrink:0;
    background:var(--ink); border:1px solid rgba(255,255,255,.25);
  }
  .lang-mini{display:flex; gap:4px;}
  .lang-mini button{
    width:28px;height:28px; border-radius:50%; border:1px solid transparent;
    background:none; font-size:14px; cursor:pointer; display:flex;align-items:center;justify-content:center;
  }
  .lang-mini button.active{border-color:var(--paper);}

  /* ---------- Categories screen ---------- */
  .cat-list{flex:1; display:flex; flex-direction:column; padding:8px 20px 40px;}
 .cat-row{
    display:flex; align-items:center; justify-content:center;
    padding:26px 2px;
    border-bottom:1px solid var(--hairline);
    cursor:pointer;
    background:none; border-top:none; border-left:none; border-right:none;
    width:100%; text-align:center; font:inherit; color:#000000;
  }
  html[dir="rtl"] .cat-row{text-align:center;}
  .cat-row:active{opacity:.55;}
  .cat-name{font-size:26px; font-weight:900; color:#000000; letter-spacing:-.01em; width:100%;}
  .lang-ar .cat-name{font-family:'Noto Kufi Arabic',serif; letter-spacing:0;}
  .cat-arrow{font-size:18px; color:var(--muted-2); flex-shrink:0; margin-inline-start:12px;}
  .cat-count{font-size:11px; color:var(--muted); letter-spacing:.05em; margin-top:4px; display:block;}

  .hint-bar{
    text-align:center; font-size:11px; color:var(--muted);
    letter-spacing:.04em; padding:18px 30px 4px;
  }

  /* ---------- Product list ---------- */
  .product-scroll{flex:1; padding:6px 20px 60px;}
 .subgroup-heading{
    font-size:13.5px; letter-spacing:.16em; text-transform:uppercase;
    color:#000000; font-weight:900; text-align:center;
    margin:30px 0 2px; padding-bottom:10px; border-bottom:1px solid var(--ink);
  }
  .subgroup-heading:first-child{margin-top:14px;}

  .item-row{
    display:flex; align-items:center; gap:14px;
    padding:16px 4px;
    border-bottom:1px solid var(--hairline);
    cursor:pointer;
    transition:background .32s var(--ease), color .32s var(--ease), padding .32s var(--ease),
      border-color .32s var(--ease), box-shadow .32s var(--ease), border-radius .32s var(--ease), gap .32s var(--ease);
    position:relative;
  }
  .item-row.selected{
    background:var(--paper); color:var(--ink);
    padding:20px 18px;
    gap:18px;
    border:1.5px solid var(--ink);
    border-radius:16px;
    border-bottom:1.5px solid var(--ink);
    box-shadow:0 12px 28px rgba(0,0,0,.10);
    margin:8px 0;
  }
  .item-thumb{
    width:72px; height:72px; border-radius:12px; flex-shrink:0;
    background:var(--paper-soft); border:1px solid var(--hairline);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    transition:width .32s var(--ease), height .32s var(--ease), border-radius .32s var(--ease);
  }
  .item-row.selected .item-thumb{
    width:120px; height:120px; border-radius:16px;
    border-color:var(--ink); background:var(--paper-soft);
  }
  .item-thumb img{width:100%;height:100%;object-fit:cover;}
  .item-thumb svg{width:26px;height:26px; opacity:.35; transition:width .32s var(--ease), height .32s var(--ease);}
  .item-row.selected .item-thumb svg{width:42px; height:42px; opacity:.3;}
  .item-info{flex:1; min-width:0;}
  .item-name{font-size:15.5px; font-weight:500; letter-spacing:-.005em; transition:font-size .32s var(--ease);}
  .item-row.selected .item-name{font-size:19px; font-weight:700; line-height:1.25;}
  .item-price{font-size:14px; color:var(--muted); margin-top:3px; font-variant-numeric:tabular-nums; transition:font-size .32s var(--ease);}
  .item-row.selected .item-price{color:var(--ink); font-size:16px; font-weight:600; margin-top:8px;}
  .item-check{
    width:22px;height:22px; border-radius:50%; border:1.4px solid var(--hairline);
    flex-shrink:0; display:flex; align-items:center; justify-content:center;
    transition:all .28s var(--ease);
  }
  .item-row.selected .item-check{
    position:absolute; top:14px; right:14px;
    background:var(--ink); border-color:var(--ink);
  }
  html[dir="rtl"] .item-row.selected .item-check{right:auto; left:14px;}
  .item-check svg{width:12px;height:12px; opacity:0; transition:opacity .2s var(--ease); stroke:var(--paper);}
  .item-row.selected .item-check svg{opacity:1;}


  .selected-bar{
    position:sticky; bottom:0; z-index:15;
    background:var(--ink); color:var(--paper);
    padding:14px 20px; font-size:13px;
    display:flex; align-items:center; justify-content:space-between;
    animation:slideUp .3s var(--ease);
  }
  @keyframes slideUp{from{transform:translateY(100%)} to{transform:translateY(0)}}
  .selected-bar b{font-weight:600;}
  .selected-bar button{
    background:var(--paper); color:var(--ink); border:none; border-radius:999px;
    padding:8px 16px; font-size:12px; font-weight:600; cursor:pointer;
  }

  .empty-note{padding:40px 4px; color:var(--muted); font-size:14px; text-align:center;}

  /* ---------- Admin ---------- */
  .admin-wrap{padding:0 0 60px;}
  .admin-tabs{display:flex; border-bottom:1px solid var(--hairline); padding:0 20px;}
  .admin-tab{
    flex:1; text-align:center; padding:14px 4px; font-size:13px; font-weight:600;
    color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; background:none; border-top:none;border-left:none;border-right:none;
  }
  .admin-tab.active{color:var(--ink); border-bottom-color:var(--ink);}
  .admin-section{padding:20px;}
  .admin-block{border:1px solid var(--hairline); border-radius:12px; padding:16px; margin-bottom:16px;}
  .admin-block-title{font-size:13px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:11.5px; color:var(--muted); margin-bottom:5px; font-weight:600;}
  .field input, .field select{
    width:100%; padding:11px 12px; border:1px solid var(--hairline); border-radius:8px;
    font-size:14px; font-family:inherit; background:var(--paper);
  }
  .field input:focus, .field select:focus{outline:2px solid var(--ink); outline-offset:1px;}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding:10px 16px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; border:1px solid var(--ink);
  }
  .btn-primary{background:var(--ink); color:var(--paper);}
  .btn-ghost{background:none; color:var(--ink);}
  .btn-danger{background:none; color:#a02020; border-color:#a02020;}
  .btn-sm{padding:6px 10px; font-size:12px; border-radius:6px;}
  .btn-block{width:100%;}
  .admin-item-row{
    display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--hairline);
  }
  .admin-item-row:last-child{border-bottom:none;}
  .admin-thumb{width:40px;height:40px;border-radius:8px;background:var(--paper-soft);border:1px solid var(--hairline);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .admin-thumb img{width:100%;height:100%;object-fit:cover;}
  .admin-item-info{flex:1; min-width:0;}
  .admin-item-name{font-size:14px; font-weight:600;}
  .admin-item-price{font-size:12px; color:var(--muted);}
  .admin-item-actions{display:flex; gap:6px;}
  .subgroup-chip{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 14px; border:1px solid var(--hairline); border-radius:10px; margin-bottom:8px;
    cursor:pointer;
  }
  .reorder-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 2px; border-bottom:1px solid var(--hairline);
  }
  .reorder-row:last-of-type{border-bottom:none;}
  .reorder-label{font-size:13.5px; font-weight:500;}
  .reorder-btns{display:flex; gap:6px;}
  .reorder-btns .btn{min-width:32px; padding:5px 0; text-align:center;}
  .reorder-btns .btn[disabled]{opacity:.25; cursor:default; pointer-events:none;}
  .admin-block-title .btn[disabled]{opacity:.25; cursor:default; pointer-events:none;}
  .admin-item-actions .btn[disabled]{opacity:.25; cursor:default; pointer-events:none;}
  .subgroup-chip.active{border-color:var(--ink); background:var(--paper-soft);}
  .file-input-wrap{display:flex; align-items:center; gap:10px;}
  .file-input-wrap input[type=file]{display:none;}
  .file-label{
    border:1px dashed var(--hairline-strong); border-radius:8px; padding:9px 14px; font-size:12px; font-weight:600; cursor:pointer;
  }
  .admin-preview{width:44px;height:44px;border-radius:8px;overflow:hidden;background:var(--paper-soft);border:1px solid var(--hairline); flex-shrink:0;}
  .admin-preview img{width:100%;height:100%;object-fit:cover;}
  .modal-overlay{
    position:fixed; inset:0; background:rgba(10,10,10,.5); z-index:50;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .crop-overlay{
    position:fixed; inset:0; background:#000; z-index:70;
    display:flex; flex-direction:column;
  }
  .crop-stage{flex:1; position:relative; overflow:hidden; background:#000;}
  .crop-stage img{display:block; max-width:100%;}
  .crop-toolbar{
    background:#111; padding:14px 16px; display:flex; gap:10px; align-items:center;
    justify-content:space-between; flex-wrap:wrap;
  }
  .crop-toolbar-title{color:#fff; font-size:13px; font-weight:600; width:100%; text-align:center; margin-bottom:2px;}
  .crop-btn-row{display:flex; gap:10px; width:100%;}
  .crop-btn{
    flex:1; padding:12px 0; border-radius:10px; border:1px solid rgba(255,255,255,.3);
    background:transparent; color:#fff; font-size:14px; font-weight:600; cursor:pointer;
  }
  .crop-btn.primary{background:#fff; color:#000; border-color:#fff;}
  .crop-zoom-row{display:flex; align-items:center; gap:10px; width:100%; color:#fff; font-size:12px;}
  .crop-zoom-row input[type=range]{flex:1;}
  .photo-field-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .photo-field-row .file-label{margin:0;}
  .modal-sheet{
    background:var(--paper); width:100%; max-width:480px; border-radius:18px 18px 0 0;
    padding:20px 20px 28px; max-height:85vh; overflow-y:auto;
    animation:sheetUp .28s var(--ease);
  }
  @keyframes sheetUp{from{transform:translateY(30px); opacity:0} to{transform:translateY(0); opacity:1}}
  .modal-title{font-size:16px; font-weight:700; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center;}
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:999px;
    font-size:12.5px; z-index:60; animation:toastIn .25s var(--ease);
  }
  @keyframes toastIn{from{opacity:0; transform:translate(-50%,8px)} to{opacity:1; transform:translate(-50%,0)}}
  .admin-footer-link{
    text-align:center; padding:26px 0 6px; font-size:11px; color:var(--muted-2); letter-spacing:.05em;
  }
  .settings-note{font-size:11px; color:var(--muted); line-height:1.5; margin-top:6px;}

  .staff-login-link{
    text-align:center; padding:22px 0 8px; font-size:13px; font-weight:600;
    color:var(--muted); cursor:pointer;
  }
  .staff-login-link:active{color:var(--ink);}
  .pin-dots{display:flex; justify-content:center; gap:14px; margin:18px 0;}
  .pin-dots span{
    width:16px; height:16px; border-radius:50%; border:1.5px solid var(--ink); display:inline-block;
  }
  .pin-dots span.filled{background:var(--ink);}
  .pin-keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; max-width:260px; margin:0 auto;}
  .pin-key{
    padding:16px 0; border:1px solid var(--hairline); border-radius:10px; background:none;
    font-size:18px; font-weight:600; cursor:pointer;
  }
  .pin-key:active{background:var(--paper-soft);}
  .pin-error{color:#a02020; font-size:12.5px; text-align:center; margin-top:10px; min-height:16px;}

  .order-list{max-height:50vh; overflow-y:auto;}
  .order-row{display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--hairline);}
  .order-row-thumb{width:44px;height:44px;border-radius:9px;background:var(--paper-soft);border:1px solid var(--hairline);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .order-row-thumb img{width:100%;height:100%;object-fit:cover;}
  .order-row-thumb svg{width:18px;height:18px; opacity:.35;}
  .order-row-info{flex:1; min-width:0;}
  .order-row-name{font-size:14.5px; font-weight:500;}
  .order-row-price{font-size:13px; color:var(--muted); margin-top:2px;}
  .order-total-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:16px 2px 4px; margin-top:6px; border-top:1px solid var(--ink);
    font-size:15px; font-weight:700;
  }

  .qty-stepper{
    display:flex; align-items:center; gap:10px;
    margin-top:10px;
  }
  .order-row .qty-stepper{margin-top:0;}
  .qty-stepper button{
    width:28px; height:28px; border-radius:50%; border:1.4px solid var(--ink);
    background:none; font-size:16px; font-weight:600; cursor:pointer; color:var(--ink);
    display:flex; align-items:center; justify-content:center; line-height:1;
  }
  .qty-stepper button:active{background:var(--ink); color:var(--paper);}
  .qty-stepper span{font-size:14px; font-weight:700; min-width:16px; text-align:center; font-variant-numeric:tabular-nums;}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  "use strict";

  
  const DEFAULT_DATA = {

  async function saveData(){
    if(saveInFlight) return false;
    saveInFlight = true;
    const wasPhotoRemovalApproved = allowPhotoLossOnce;
    allowPhotoLossOnce = false;

    try{
      // Before every write, verify we are updating the real current row. This prevents
      // a stale/default in-memory copy from replacing a photo-rich remote menu.
      const remoteData = await readRemoteDataForSafety();
      if(remoteData){
        const remotePhotos = countPhotos(remoteData);
        const localPhotos = countPhotos(data);

        // A normal admin action can remove one photo at a time. A sudden larger
        // drop is treated as corruption and the write is blocked.
        if(!wasPhotoRemovalApproved && localPhotos < remotePhotos - 1){
          throw new Error(`Refusing unsafe save: photo count would drop from ${remotePhotos} to ${localPhotos}`);
        }
      }

      const payload = {
        id: SUPABASE_ROW_ID,
        data: data,
        updated_at: new Date().toISOString()
      };

      const res = await fetch(`${REST_URL}?on_conflict=id`, {
        method: "POST",
        headers: {
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
          "Content-Type": "application/json",
          "Prefer": "resolution=merge-duplicates,return=minimal"
        },
        body: JSON.stringify(payload)
      });

      if(!res.ok){
        let details = "";
        try{ details = await res.text(); }catch(e){}
        throw new Error(`Supabase save failed: HTTP ${res.status}${details ? ` — ${details}` : ""}`);
      }

      // Only back up after Supabase explicitly accepted the write.
      saveLocalBackup(data);
      return true;
    }catch(e){
      console.error("Storage save failed", e);
      showToast("Kaydetme başarısız oldu — veriler değiştirilemedi");
      throw e;
    }finally{
      saveInFlight = false;
    }
  }

          }]
        })
      });
      const json = await resp.json();
      const textBlock = (json.content || []).find(b=>b.type==="text");
      if(!textBlock) throw new Error("no text block in response");
      let clean = textBlock.text.trim();
      clean = clean.replace(/^```json/i,"").replace(/^```/,"").replace(/```$/,"").trim();
      const parsed = JSON.parse(clean);
      return {en: parsed.en || trName, ar: parsed.ar || trName};
    }catch(e){
      console.error("Auto-translate failed", e);
      return {en: trName, ar: trName};
    }
  }

  function resizeImage(file, maxDim, quality){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = function(e){
        const img = new Image();
        img.onload = function(){
          let w = img.width, h = img.height;
          if(w > h){ if(w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; } }
          else{ if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; } }
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function fileToDataUrl(file){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = e => resolve(e.target.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // Opens a full-screen crop UI over `imageSrc` (a data URL). Calls onDone(croppedDataUrl)
  // when the user confirms, or does nothing if they cancel.
  function openCropModal(imageSrc, aspectRatio, onDone){
    const overlay = document.createElement("div");
    overlay.className = "crop-overlay";
    overlay.innerHTML = `
      <div class="crop-toolbar"><div class="crop-toolbar-title">Fotoğrafı Kırp</div></div>
      <div class="crop-stage"><img id="cropTargetImg" src="${imageSrc}"></div>
      <div class="crop-toolbar">
        <div class="crop-zoom-row">
          <span>−</span>
          <input type="range" id="cropZoom" min="0" max="3" step="0.05" value="0">
          <span>+</span>
        </div>
        <div class="crop-btn-row">
          <button class="crop-btn" id="cropCancelBtn">Vazgeç</button>
          <button class="crop-btn primary" id="cropConfirmBtn">Kırp ve Kullan</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);

    const imgEl = document.getElementById("cropTargetImg");
    let cropper;
    function initCropper(){
      cropper = new Cropper(imgEl, {
        aspectRatio: aspectRatio,
        viewMode: 1,
        dragMode: "move",
        autoCropArea: 1,
        background: false,
        movable: true,
        zoomable: true,
        scalable: false,
        rotatable: false,
        guides: true,
        center: true,
        cropBoxMovable: false,
        cropBoxResizable: false,
        toggleDragModeOnDblclick: false
      });
    }
    if(imgEl.complete && imgEl.naturalWidth > 0){
      initCropper();
    } else {
      imgEl.onload = initCropper;
    }

    const zoomInput = document.getElementById("cropZoom");
    zoomInput.addEventListener("input", () => {
      if(cropper) cropper.zoomTo(parseFloat(zoomInput.value));
    });

    function cleanup(){
      if(cropper) cropper.destroy();
      overlay.remove();
    }

    document.getElementById("cropCancelBtn").addEventListener("click", cleanup);
    document.getElementById("cropConfirmBtn").addEventListener("click", () => {
      if(!cropper){
        // Not ready yet (image still loading) — try once more shortly instead of silently failing.
        if(imgEl.complete && imgEl.naturalWidth > 0) initCropper();
        if(!cropper){ showToast("Görsel yükleniyor, tekrar deneyin"); return; }
      }
      const canvas = cropper.getCroppedCanvas({
        width: 600, height: aspectRatio ? Math.round(600 / aspectRatio) : 600,
        imageSmoothingQuality: "high"
      });
      const dataUrl = canvas.toDataURL("image/jpeg", 0.82);
      cleanup();
      onDone(dataUrl);
    });
  }

  function renderIconRain(count){
    let html = '<div class="icon-rain">';
    for(let i=0; i<count; i++){
      const src = RAIN_ICON_IMAGES[i % RAIN_ICON_IMAGES.length];
      const heightPx = 40 + Math.round(Math.random()*30);
      const left = Math.round(Math.random()*92);
      const duration = (10 + Math.random()*13).toFixed(1);
      const delay = -(Math.random()*22).toFixed(1);
      const opacity = (0.22 + Math.random()*0.30).toFixed(2);
      html += `<span class="rain-icon" style="left:${left}%; height:${heightPx}px; opacity:${opacity}; animation-duration:${duration}s; animation-delay:${delay}s;">
        <img src="${src}" alt="">
      </span>`;
    }
    html += '</div>';
    return html;
  }

  function renderWelcome(){
    const logo = data.settings.logo
      ? `<img src="${data.settings.logo}" alt="logo">`
      : `<span>${(data.settings.cafeName||"C").split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase()}</span>`;

    app.innerHTML = `
      <div class="welcome-screen">
        ${renderIconRain(16)}
        <div class="welcome-logo">${logo}</div>
        <div class="welcome-eyebrow">QR Menu</div>
        <button class="entry-sign" data-enter-default>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 5l7 7-7 7M20 12H4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          MENÜ GİRİŞİ
        </button>
        <div class="lang-label">${STR.tr.selectLang} / ${STR.en.selectLang} / ${STR.ar.selectLang}</div>
        <div class="lang-row">
          ${["tr","en","ar"].map(l=>`
            <button class="lang-pill" data-lang="${l}">
              <span class="lang-flag">${FLAGS[l]}</span>${LANG_LABEL[l]}
            </button>`).join("")}
        </div>
      </div>
    `;
    app.querySelectorAll("[data-lang]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        setLang(btn.dataset.lang);
        state.screen = "categories";
        render();
      });
    });
    app.querySelector("[data-enter-default]").addEventListener("click", ()=>{
      setLang("tr");
      state.screen = "categories";
      render();
    });
  }

  /* ---------------- CATEGORIES ---------------- */
  function buildSections(){
    const sections = [];
    data.categories.forEach(cat=>{
      if(cat.subgroups.length === 1){
        const sg = cat.subgroups[0];
        sections.push({
          label: cat.name[state.lang] || cat.name.tr,
          items: sg.items
        });
      } else {
        cat.subgroups.forEach(sg=>{
          sections.push({
            label: sg.name,
            items: sg.items
          });
        });
      }
    });
    return sections;
  }

  function renderItemRow(item){
    const qty = getQty(item.id);
    const isSel = qty > 0;
    const thumb = item.photo
      ? `<img src="${item.photo}" alt="">`
      : iconFork();
    return `
      <div class="item-row ${isSel?"selected":""}" data-item="${item.id}">
        <div class="item-thumb">${thumb}</div>
        <div class="item-info">
          <div class="item-name">${itemName(item)}</div>
          <div class="item-price">${item.price} TL</div>
          ${isSel ? `
            <div class="qty-stepper" data-stop-toggle>
              <button data-qty-dec="${item.id}" aria-label="minus">−</button>
              <span>${qty}</span>
              <button data-qty-inc="${item.id}" aria-label="plus">+</button>
            </div>
          ` : ""}
        </div>
        <div class="item-check">${iconCheck()}</div>
      </div>
    `;
  }

  /* ---------------- FULL MENU (one continuous scroll) ---------------- */
  function renderCategories(){
    const sections = buildSections();

    let itemsHtml = "";
    sections.forEach(sec=>{
      if(!sec.items.length) return;
      itemsHtml += `<div class="subgroup-heading">${sec.label}</div>`;
      sec.items.forEach(item=>{ itemsHtml += renderItemRow(item); });
    });
    if(!itemsHtml){
      itemsHtml = `<div class="empty-note">—</div>`;
    }

    app.innerHTML = `
      <div class="topbar">
        <div class="topbar-left">
          <button class="icon-btn back-btn" data-back-welcome>${iconBack()}<span>${t("back")}</span></button>
        </div>
        <div class="topbar-title display">${logoTag()}<span>${t("menu")}</span></div>
        <div class="lang-mini">
          ${["tr","en","ar"].map(l=>`<button data-switch-lang="${l}" class="${state.lang===l?"active":""}">${FLAGS[l]}</button>`).join("")}
        </div>
      </div>
      <div class="hint-bar">${t("tapHint")}</div>
      <div class="product-scroll">${itemsHtml}</div>
      <div class="staff-login-link" data-open-pin>🔒 Personel Girişi</div>
      ${renderOrderBar()}
    `;
    app.querySelector("[data-back-welcome]").addEventListener("click", ()=>{
      state.screen = "welcome";
      render();
    });
    bindOrderBarEvents();
    app.querySelectorAll("[data-switch-lang]").forEach(el=>{
      el.addEventListener("click", ()=>{ setLang(el.dataset.switchLang); render(); });
    });
    app.querySelector("[data-open-pin]").addEventListener("click", ()=>{
      openModal("adminPin", {});
    });
    app.querySelectorAll("[data-item]").forEach(el=>{
      el.addEventListener("click", (e)=>{
        if(e.target.closest("[data-stop-toggle]")) return;
        const id = el.dataset.item;
        setQty(id, getQty(id) > 0 ? 0 : 1);
        render();
      });
    });
    app.querySelectorAll("[data-qty-inc]").forEach(el=>{
      el.addEventListener("click", (e)=>{
        e.stopPropagation();
        adjustQty(el.dataset.qtyInc, 1);
        render();
      });
    });
    app.querySelectorAll("[data-qty-dec]").forEach(el=>{
      el.addEventListener("click", (e)=>{
        e.stopPropagation();
        adjustQty(el.dataset.qtyDec, -1);
        render();
      });
    });
  }

  /* ---------------- ADMIN ---------------- */
  function renderAdmin(){
    const cat = data.categories.find(c=>c.id === state.adminActiveCategory) || data.categories[0];

    app.innerHTML = `
      <div class="topbar">
        <div class="topbar-left">
          <button class="icon-btn back-btn" data-admin-back>${iconBack()}<span>${t("back")}</span></button>
        </div>
        <div class="topbar-title display">${logoTag()}<span>${t("admin")}</span></div>
        <div style="width:32px"></div>
      </div>
      <div class="admin-tabs">
        <button class="admin-tab ${state.adminTab==='categories'?'active':''}" data-tab="categories">Kategoriler</button>
        <button class="admin-tab ${state.adminTab==='settings'?'active':''}" data-tab="settings">Ayarlar</button>
      </div>
      <div class="admin-wrap">
        ${state.adminTab === "categories" ? renderAdminCategories(cat) : renderAdminSettings()}
      </div>
    `;

    app.querySelector("[data-admin-back]").addEventListener("click", ()=>{
      state.screen = "categories";
      render();
    });
    app.querySelectorAll("[data-tab]").forEach(el=>{
      el.addEventListener("click", ()=>{ state.adminTab = el.dataset.tab; render(); });
    });
    bindAdminCategoryEvents();
    bindAdminSettingsEvents();
  }

  function renderAdminCategories(cat){
    const catIdx = data.categories.findIndex(c=>c.id===cat.id);
    const catOrderHtml = data.categories.map((c,i)=>`
      <div class="reorder-row">
        <span class="reorder-label">${i+1}. ${c.name.tr}</span>
        <span class="reorder-btns">
          <button class="btn btn-sm btn-ghost" data-move-cat-up="${c.id}" ${i===0?"disabled":""}>↑</button>
          <button class="btn btn-sm btn-ghost" data-move-cat-down="${c.id}" ${i===data.categories.length-1?"disabled":""}>↓</button>
        </span>
      </div>
    `).join("");

    const catTabs = data.categories.map(c=>`
      <button class="btn btn-sm ${c.id===cat.id?'btn-primary':'btn-ghost'}" data-select-cat="${c.id}" style="margin:0 6px 6px 0;">${c.name.tr}</button>
    `).join("");

    const subgroupsHtml = cat.subgroups.map((sg, sgIdx)=>`
      <div class="admin-block">
        <div class="admin-block-title">
          <span>${sg.name}</span>
          <span style="display:flex; gap:6px;">
            <button class="btn btn-sm btn-ghost" data-move-sg-up="${sg.id}" ${sgIdx===0?"disabled":""}>↑</button>
            <button class="btn btn-sm btn-ghost" data-move-sg-down="${sg.id}" ${sgIdx===cat.subgroups.length-1?"disabled":""}>↓</button>
            <button class="btn btn-sm btn-ghost" data-rename-sg="${sg.id}">${iconEdit()}</button>
            <button class="btn btn-sm btn-danger" data-del-sg="${sg.id}">${iconTrash()}</button>
          </span>
        </div>
        ${sg.items.map((it, itIdx)=>`
          <div class="admin-item-row">
            <div class="admin-thumb">${it.photo?`<img src="${it.photo}">`:iconFork()}</div>
            <div class="admin-item-info">
              <div class="admin-item-name">${it.name.tr || it.name}</div>
              <div class="admin-item-price">${it.price} TL</div>
            </div>
            <div class="admin-item-actions">
              <button class="btn btn-sm btn-ghost" data-move-item-up="${sg.id}|${it.id}" ${itIdx===0?"disabled":""}>↑</button>
              <button class="btn btn-sm btn-ghost" data-move-item-down="${sg.id}|${it.id}" ${itIdx===sg.items.length-1?"disabled":""}>↓</button>
              <button class="btn btn-sm btn-ghost" data-edit-item="${sg.id}|${it.id}">${iconEdit()}</button>
              <button class="btn btn-sm btn-danger" data-del-item="${sg.id}|${it.id}">${iconTrash()}</button>
            </div>
          </div>
        `).join("")}
        <button class="btn btn-ghost btn-block" style="margin-top:10px;" data-add-item="${sg.id}">${iconPlus()} Ürün Ekle</button>
      </div>
    `).join("");

    return `
      <div class="admin-section">
        <div class="admin-block">
          <div class="admin-block-title"><span>Kategori Sırası</span></div>
          ${catOrderHtml}
          <div class="settings-note">Menüde üstten alta hangi kategorinin önce görüneceğini belirler.</div>
        </div>
        <div style="display:flex; flex-wrap:wrap; margin-bottom:14px;">${catTabs}</div>
        ${subgroupsHtml}
        <button class="btn btn-ghost btn-block" data-add-sg="${cat.id}">${iconPlus()} Alt Grup Ekle</button>
      </div>
    `;
  }

  function renderAdminSettings(){
    const logoPreview = data.settings.logo ? `<img src="${data.settings.logo}">` : "";
    const hasLogo = !!data.settings.logo;
    return `
      <div class="admin-section">
        <div class="admin-block">
          <div class="admin-block-title"><span>Kafe Bilgileri</span></div>
          <div class="field">
            <label>Kafe Adı</label>
            <input type="text" id="cafeNameInput" value="${data.settings.cafeName}">
          </div>
          <div class="field">
            <label>Logo</label>
            <div class="photo-field-row">
              <div class="admin-preview" id="logoPreviewBox">${logoPreview}</div>
              <label class="file-label">Logo Yükle<input type="file" accept="image/*" id="logoUpload"></label>
              <button class="btn btn-sm btn-ghost" id="logoEditBtn" style="display:${hasLogo?"inline-flex":"none"}">${iconEdit()} Kırp</button>
              <button class="btn btn-sm btn-danger" id="logoRemoveBtn" style="display:${hasLogo?"inline-flex":"none"}">${iconTrash()} Kaldır</button>
            </div>
            <div class="settings-note">Kare bir logo görseli önerilir. Yükledikten sonra kırpabilirsiniz.</div>
          </div>
          <button class="btn btn-primary btn-block" id="saveSettingsBtn">Kaydet</button>
        </div>
        <div class="admin-block">
          <div class="admin-block-title"><span>Personel Girişi Kodu</span></div>
          <div class="field">
            <label>4 Haneli Kod</label>
            <input type="text" id="adminPinInput" inputmode="numeric" maxlength="4" value="${data.settings.adminPin || "1234"}">
            <div class="settings-note">Bu kod, menüdeki "Personel Girişi" bağlantısına girmek için istenir. Sadece rakam kullanın.</div>
          </div>
          <button class="btn btn-primary btn-block" id="savePinBtn">Kodu Kaydet</button>
        </div>
        <div class="settings-note" style="text-align:center;">Bu menü verileri tüm ziyaretçiler tarafından görülür (paylaşılan veri).</div>
      </div>
    `;
  }

  function bindAdminSettingsEvents(){
    const logoPreviewBox = document.getElementById("logoPreviewBox");
    const logoEditBtn = document.getElementById("logoEditBtn");
    const logoRemoveBtn = document.getElementById("logoRemoveBtn");

    async function setLogo(dataUrl){
      data.settings.logo = dataUrl;
      await saveData();
      showToast(dataUrl ? "Logo güncellendi" : "Logo kaldırıldı");
      render();
    }

    const logoInput = document.getElementById("logoUpload");
    if(logoInput){
      logoInput.addEventListener("change", async (e)=>{
        const file = e.target.files[0];
        if(!file) return;
        const rawDataUrl = await fileToDataUrl(file);
        openCropModal(rawDataUrl, 1, async (croppedDataUrl)=>{
          await setLogo(croppedDataUrl);
        });
        logoInput.value = "";
      });
    }
    if(logoEditBtn){
      logoEditBtn.addEventListener("click", ()=>{
        if(!data.settings.logo) return;
        openCropModal(data.settings.logo, 1, async (croppedDataUrl)=>{
          await setLogo(croppedDataUrl);
        });
      });
    }
    if(logoRemoveBtn){
      logoRemoveBtn.addEventListener("click", async ()=>{
        await setLogo(null);
      });
    }
    const saveBtn = document.getElementById("saveSettingsBtn");
    if(saveBtn){
      saveBtn.addEventListener("click", async ()=>{
        data.settings.cafeName = document.getElementById("cafeNameInput").value.trim() || data.settings.cafeName;
        await saveData();
        showToast("Ayarlar kaydedildi");
        render();
      });
    }
    const savePinBtn = document.getElementById("savePinBtn");
    if(savePinBtn){
      savePinBtn.addEventListener("click", async ()=>{
        const val = document.getElementById("adminPinInput").value.trim();
        if(!/^\d{4}$/.test(val)){
          showToast("Kod tam olarak 4 rakam olmalı");
          return;
        }
        data.settings.adminPin = val;
        await saveData();
        showToast("Kod güncellendi");
        render();
      });
    }
  }

  function moveArrayItem(arr, index, delta){
    const newIndex = index + delta;
    if(newIndex < 0 || newIndex >= arr.length) return false;
    const [moved] = arr.splice(index, 1);
    arr.splice(newIndex, 0, moved);
    return true;
  }

  function bindAdminCategoryEvents(){
    app.querySelectorAll("[data-select-cat]").forEach(el=>{
      el.addEventListener("click", ()=>{ state.adminActiveCategory = el.dataset.selectCat; render(); });
    });
    app.querySelectorAll("[data-move-cat-up]").forEach(el=>{
      el.addEventListener("click", async ()=>{
        const idx = data.categories.findIndex(c=>c.id===el.dataset.moveCatUp);
        if(moveArrayItem(data.categories, idx, -1)){ await saveData(); render(); }
      });
    });
    app.querySelectorAll("[data-move-cat-down]").forEach(el=>{
      el.addEventListener("click", async ()=>{
        const idx = data.categories.findIndex(c=>c.id===el.dataset.moveCatDown);
        if(moveArrayItem(data.categories, idx, 1)){ await saveData(); render(); }
      });
    });
    app.querySelectorAll("[data-move-sg-up]").forEach(el=>{
      el.addEventListener("click", async ()=>{
        const cat = data.categories.find(c=>c.id===state.adminActiveCategory);
        const idx = cat.subgroups.findIndex(s=>s.id===el.dataset.moveSgUp);
        if(moveArrayItem(cat.subgroups, idx, -1)){ await saveData(); render(); }
      });
    });
    app.querySelectorAll("[data-move-sg-down]").forEach(el=>{
      el.addEventListener("click", async ()=>{
        const cat = data.categories.find(c=>c.id===state.adminActiveCategory);
        const idx = cat.subgroups.findIndex(s=>s.id===el.dataset.moveSgDown);
        if(moveArrayItem(cat.subgroups, idx, 1)){ await saveData(); render(); }
      });
    });
    app.querySelectorAll("[data-move-item-up]").forEach(el=>{
      el.addEventListener("click", async ()=>{
        const [sgId, itemId] = el.dataset.moveItemUp.split("|");
        const cat = data.categories.find(c=>c.id===state.adminActiveCategory);
        const sg = cat.subgroups.find(s=>s.id===sgId);
        const idx = sg.items.findIndex(i=>i.id===itemId);
        if(moveArrayItem(sg.items, idx, -1)){ await saveData(); render(); }
      });
    });
    app.querySelectorAll("[data-move-item-down]").forEach(el=>{
      el.addEventListener("click", async ()=>{
        const [sgId, itemId] = el.dataset.moveItemDown.split("|");
        const cat = data.categories.find(c=>c.id===state.adminActiveCategory);
        const sg = cat.subgroups.find(s=>s.id===sgId);
        const idx = sg.items.findIndex(i=>i.id===itemId);
        if(moveArrayItem(sg.items, idx, 1)){ await saveData(); render(); }
      });
    });
    app.querySelectorAll("[data-add-sg]").forEach(el=>{
      el.addEventListener("click", ()=> openModal("addSubgroup", {catId: el.dataset.addSg}));
    });
    app.querySelectorAll("[data-rename-sg]").forEach(el=>{
      el.addEventListener("click", ()=> openModal("renameSubgroup", {sgId: el.dataset.renameSg}));
    });
    app.querySelectorAll("[data-del-sg]").forEach(el=>{
      el.addEventListener("click", async ()=>{
        const cat = data.categories.find(c=>c.id===state.adminActiveCategory);
        const sg = cat.subgroups.find(s=>s.id===el.dataset.delSg);
        if(!confirm(`"${sg.name}" alt grubunu ve içindeki tüm ürünleri silmek istediğinize emin misiniz?`)) return;
        cat.subgroups = cat.subgroups.filter(s=>s.id !== el.dataset.delSg);
        await saveData();
        render();
      });
    });
    app.querySelectorAll("[data-add-item]").forEach(el=>{
      el.addEventListener("click", ()=> openModal("addItem", {sgId: el.dataset.addItem}));
    });
    app.querySelectorAll("[data-edit-item]").forEach(el=>{
      el.addEventListener("click", ()=>{
        const [sgId, itemId] = el.dataset.editItem.split("|");
        openModal("editItem", {sgId, itemId});
      });
    });
    app.querySelectorAll("[data-del-item]").forEach(el=>{
      el.addEventListener("click", async ()=>{
        const [sgId, itemId] = el.dataset.delItem.split("|");
        const cat = data.categories.find(c=>c.id===state.adminActiveCategory);
        const sg = cat.subgroups.find(s=>s.id===sgId);
        const item = sg.items.find(i=>i.id===itemId);
        if(!confirm(`"${item.name.tr || item.name}" ürününü silmek istediğinize emin misiniz?`)) return;
        sg.items = sg.items.filter(i=>i.id !== itemId);
        await saveData();
        render();
      });
    });
  }

  function openModal(type, payload){
    state.modal = {type, payload};
    renderModal();
  }
  function closeModal(){
    state.modal = null;
    const existing = document.querySelector(".modal-overlay");
    if(existing) existing.remove();
  }

  function renderModal(){
    const existing = document.querySelector(".modal-overlay");
    if(existing) existing.remove();
    if(!state.modal) return;
    const {type, payload} = state.modal;
    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";

    let title = "", body = "", onSave = null, skipDefaultButtons = false;

    if(type === "adminPin"){
      skipDefaultButtons = true;
      title = "Personel Girişi";
      body = `
        <div class="pin-dots" id="m_pinDots">
          ${[0,1,2,3].map(()=>'<span></span>').join("")}
        </div>
        <div class="pin-keypad">
          ${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="pin-key" data-pin-key="${n}">${n}</button>`).join("")}
          <span></span>
          <button class="pin-key" data-pin-key="0">0</button>
          <button class="pin-key" data-pin-backspace>⌫</button>
        </div>
        <div class="pin-error" id="m_pinError"></div>
      `;
    }

    if(type === "orderSummary"){
      skipDefaultButtons = true;
      const items = getSelectedFlat();
      title = t("yourSelection");
      if(items.length === 0){
        body = `<div class="empty-note">${t("emptySelection")}</div>`;
      } else {
        const total = items.reduce((s,i)=>s+i.price*i.qty,0);
        body = `
          <div class="order-list">
            ${items.map(it=>`
              <div class="order-row">
                <div class="order-row-thumb">${it.photo?`<img src="${it.photo}">`:iconFork()}</div>
                <div class="order-row-info">
                  <div class="order-row-name">${itemName(it)}</div>
                  <div class="order-row-price">${it.price} TL × ${it.qty} = ${it.price*it.qty} TL</div>
                </div>
                <div class="qty-stepper">
                  <button data-modal-qty-dec="${it.id}" aria-label="minus">−</button>
                  <span>${it.qty}</span>
                  <button data-modal-qty-inc="${it.id}" aria-label="plus">+</button>
                </div>
              </div>
            `).join("")}
          </div>
          <div class="order-total-row">
            <span>${t("total")}</span>
            <span>${total} TL</span>
          </div>
          <button class="btn btn-ghost btn-block" style="margin-top:14px;" id="m_clear_all">${t("clear")}</button>
        `;
      }
    }

    if(type === "addSubgroup"){
      title = "Alt Grup Ekle";
      body = `
        <div class="field"><label>Alt Grup Adı</label><input type="text" id="m_sgName" placeholder="örn. Tatlılar"></div>
        <button class="btn btn-primary btn-block" id="m_save">Ekle</button>
      `;
      onSave = async ()=>{
        const name = document.getElementById("m_sgName").value.trim();
        if(!name) return;
        const cat = data.categories.find(c=>c.id===payload.catId);
        cat.subgroups.push({id: uid("sg"), name, items:[]});
        await saveData();
        closeModal();
        render();
      };
    }

    if(type === "renameSubgroup"){
      const cat = data.categories.find(c=>c.id===state.adminActiveCategory);
      const sg = cat.subgroups.find(s=>s.id===payload.sgId);
      title = "Alt Grubu Yeniden Adlandır";
      body = `
        <div class="field"><label>Alt Grup Adı</label><input type="text" id="m_sgName" value="${sg.name}"></div>
        <button class="btn btn-primary btn-block" id="m_save">Kaydet</button>
      `;
      onSave = async ()=>{
        const name = document.getElementById("m_sgName").value.trim();
        if(!name) return;
        sg.name = name;
        await saveData();
        closeModal();
        render();
      };
    }

    if(type === "addItem" || type === "editItem"){
      const cat = data.categories.find(c=>c.id===state.adminActiveCategory);
      const sg = cat.subgroups.find(s=>s.id===payload.sgId);
      const item = type === "editItem" ? sg.items.find(i=>i.id===payload.itemId) : null;
      const currentTrName = item ? (item.name.tr || item.name) : "";
      title = type === "addItem" ? "Ürün Ekle" : "Ürünü Düzenle";
      body = `
        <div class="field">
          <label>Ürün Adı (Türkçe)</label>
          <input type="text" id="m_itemName" value="${currentTrName}">
          <div class="settings-note">İngilizce ve Arapça çevirisi otomatik olarak oluşturulur.</div>
        </div>
        <div class="field"><label>Fiyat (TL)</label><input type="number" id="m_itemPrice" value="${item?item.price:""}"></div>
        <div class="field">
          <label>Fotoğraf</label>
          <div class="photo-field-row">
            <div class="admin-preview" id="m_photoPreview">${item && item.photo ? `<img src="${item.photo}">` : ""}</div>
            <label class="file-label">Fotoğraf Yükle<input type="file" accept="image/*" id="m_itemPhoto"></label>
            <button class="btn btn-sm btn-ghost" id="m_photoEditBtn" style="display:${item && item.photo ? "inline-flex" : "none"}">${iconEdit()} Kırp</button>
            <button class="btn btn-sm btn-danger" id="m_photoRemoveBtn" style="display:${item && item.photo ? "inline-flex" : "none"}">${iconTrash()} Kaldır</button>
          </div>
          <div class="settings-note">Yükledikten sonra fotoğrafı kare olarak kırpabilirsiniz.</div>
        </div>
        <button class="btn btn-primary btn-block" id="m_save">${type==="addItem"?"Ekle":"Kaydet"}</button>
        ${type==="editItem" ? `<button class="btn btn-ghost btn-block" style="margin-top:8px;" id="m_cancel2">Vazgeç</button>` : ""}
      `;
      let pendingPhoto = item ? item.photo : null;
      onSave = async ()=>{
        const trName = document.getElementById("m_itemName").value.trim();
        const price = parseFloat(document.getElementById("m_itemPrice").value) || 0;
        if(!trName) return;

        const saveBtnEl = document.getElementById("m_save");
        const originalLabel = saveBtnEl.textContent;
        saveBtnEl.textContent = "Çevriliyor...";
        saveBtnEl.disabled = true;

        // Only re-translate if the Turkish name actually changed (saves API calls on price-only edits)
        let nameObj;
        if(item && currentTrName === trName && typeof item.name === "object"){
          nameObj = item.name;
        } else {
          const t9n = await translateName(trName);
          nameObj = {tr: trName, en: t9n.en, ar: t9n.ar};
        }

        if(type === "addItem"){
          sg.items.push({id: uid("i"), name: nameObj, price, photo: pendingPhoto});
        } else {
          item.name = nameObj; item.price = price; item.photo = pendingPhoto;
        }
        await saveData();
        closeModal();
        render();
        showToast("Ürün kaydedildi ve çevrildi");
      };
      overlay.dataset.pendingPhotoRef = "1";
      setTimeout(()=>{
        const previewEl = document.getElementById("m_photoPreview");
        const editBtn = document.getElementById("m_photoEditBtn");
        const removeBtn = document.getElementById("m_photoRemoveBtn");

        function setPhoto(dataUrl){
          pendingPhoto = dataUrl;
          previewEl.innerHTML = dataUrl ? `<img src="${dataUrl}">` : "";
          editBtn.style.display = dataUrl ? "inline-flex" : "none";
          removeBtn.style.display = dataUrl ? "inline-flex" : "none";
        }

        const photoInput = document.getElementById("m_itemPhoto");
        if(photoInput){
          photoInput.addEventListener("change", async (e)=>{
            const file = e.target.files[0];
            if(!file) return;
            const rawDataUrl = await fileToDataUrl(file);
            openCropModal(rawDataUrl, 1, (croppedDataUrl)=>{
              setPhoto(croppedDataUrl);
            });
            photoInput.value = "";
          });
        }
        if(editBtn){
          editBtn.addEventListener("click", ()=>{
            if(!pendingPhoto) return;
            openCropModal(pendingPhoto, 1, (croppedDataUrl)=>{
              setPhoto(croppedDataUrl);
            });
          });
        }
        if(removeBtn){
          removeBtn.addEventListener("click", ()=>{
            allowNextPhotoRemoval();
            setPhoto(null);
          });
        }
      }, 0);
    }

    overlay.innerHTML = `
      <div class="modal-sheet">
        <div class="modal-title"><span>${title}</span><button class="icon-btn" id="m_close">✕</button></div>
        ${body}
      </div>
    `;
    document.body.appendChild(overlay);
    document.getElementById("m_close").addEventListener("click", closeModal);
    overlay.addEventListener("click", (e)=>{ if(e.target === overlay) closeModal(); });
    const saveBtn = document.getElementById("m_save");
    if(saveBtn) saveBtn.addEventListener("click", onSave);
    const cancelBtn2 = document.getElementById("m_cancel2");
    if(cancelBtn2) cancelBtn2.addEventListener("click", closeModal);

    if(type === "adminPin"){
      let entered = "";
      const dotsEl = document.getElementById("m_pinDots");
      const errorEl = document.getElementById("m_pinError");
      const updateDots = ()=>{
        dotsEl.querySelectorAll("span").forEach((s,i)=>{
          s.classList.toggle("filled", i < entered.length);
        });
      };
      const tryCheck = ()=>{
        if(entered.length === 4){
          if(entered === (data.settings.adminPin || "1234")){
            closeModal();
            state.screen = "admin";
            render();
          } else {
            errorEl.textContent = "Yanlış kod, tekrar deneyin";
            entered = "";
            updateDots();
          }
        }
      };
      overlay.querySelectorAll("[data-pin-key]").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          if(entered.length >= 4) return;
          entered += btn.dataset.pinKey;
          errorEl.textContent = "";
          updateDots();
          tryCheck();
        });
      });
      const backspaceBtn = overlay.querySelector("[data-pin-backspace]");
      if(backspaceBtn) backspaceBtn.addEventListener("click", ()=>{
        entered = entered.slice(0, -1);
        errorEl.textContent = "";
        updateDots();
      });
    }

    if(type === "orderSummary"){
      overlay.querySelectorAll("[data-modal-qty-inc]").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          adjustQty(btn.dataset.modalQtyInc, 1);
          renderModal(); render();
        });
      });
      overlay.querySelectorAll("[data-modal-qty-dec]").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          const id = btn.dataset.modalQtyDec;
          adjustQty(id, -1);
          if(getQty(id) === 0 && Object.keys(state.quantities).length === 0){ closeModal(); render(); }
          else { renderModal(); render(); }
        });
      });
      const clearAllBtn = document.getElementById("m_clear_all");
      if(clearAllBtn) clearAllBtn.addEventListener("click", ()=>{
        state.quantities = {};
        closeModal();
        render();
      });
    }
  }

  loadData();
})();
</script>
</body>
</html>
